<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0A0F1A">
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Los Cumpas">
<title>Los Cumpas · Pedidos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  /* ===== PALETA "LOS CUMPAS" — celeste/azul marino, derivada del logo =====
     Fondo azul casi negro, tarjetas un tono más claro, acento celeste vivo
     (el círculo del logo) y azul marino profundo (el texto del logo). */
  --ink:#0A0F1A;--paper:#0A0F1A;--card:#121B2E;--card2:#182541;
  --line:#22304A;--line2:#1A2743;
  --text:#EAF1FB;--muted:#8CA0C2;

  /* Marca: celeste vivo + marino profundo. El celeste es la acción principal
     (botones, foco, selección) — el marino da peso a headers y marca. */
  --cielo:#4FB6E8;--cielo-d:#2E8FC2;--cielo-tint:#12293A;
  --marino:#16294D;--marino-hi:#1F3A6B;--marino-tint:#101B33;
  --brand-grad:linear-gradient(120deg,#4FB6E8,#2E8FC2);

  /* Estados — mismos códigos semánticos que ya usa el equipo en Marín, para
     no reaprender colores: rojo urgente, ámbar a pedir, verde saludable. */
  --rojo:#E8746A;--rojo-bg:#3A1E1E;
  --ambar:#E8B84F;--ambar-bg:#3A2E12;
  --verde:#5FD08A;--verde-bg:#123A22;

  --sh-card:0 2px 10px rgba(0,0,0,.35);
  --sh-float:0 6px 20px rgba(0,0,0,.45);
  --focus-ring:0 0 0 3px rgba(79,182,232,.35);
  --radius-card:18px;--radius-btn:14px;
}
*{box-sizing:border-box;margin:0;padding:0}
.hidden{display:none !important}
html{-webkit-text-size-adjust:100%;width:100%;overflow-x:hidden}
body{font-family:'Inter',system-ui,sans-serif;background:var(--paper);color:var(--text);font-size:14px;line-height:1.4;-webkit-tap-highlight-color:transparent;width:100%;max-width:100%;min-height:100vh;padding-bottom:calc(24px + env(safe-area-inset-bottom))}
.mono{font-family:'JetBrains Mono',ui-monospace,monospace;font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:'Manrope',system-ui,sans-serif}
button{font-family:inherit}
:focus-visible{outline:none;box-shadow:var(--focus-ring)}

/* ===== Encabezado ===== */
.top{background:linear-gradient(160deg,var(--marino-tint) 0%,#0D1730 100%);border-bottom:1px solid var(--line);padding:14px 18px;padding-top:max(14px,env(safe-area-inset-top));display:flex;align-items:center;gap:12px}
.brand-mark{width:38px;height:38px;border-radius:12px;flex:none;background:var(--brand-grad);display:flex;align-items:center;justify-content:center;font-size:19px;box-shadow:var(--sh-card)}
.brand-txt .mk{font-family:'Manrope';font-weight:800;font-size:17px;letter-spacing:-.01em;color:var(--text)}
.brand-txt .loc{color:var(--muted);font-size:11.5px;font-weight:600;margin-top:1px}

/* ===== Estado de carga del catálogo ===== */
.load-banner{margin:14px 16px;padding:12px 14px;background:var(--card);border:1px solid var(--line);border-radius:var(--radius-card);display:flex;align-items:center;gap:10px;font-size:12.5px;color:var(--muted)}
.load-banner.err{border-color:var(--rojo);color:var(--rojo);background:var(--rojo-bg)}
.load-banner .spin{width:16px;height:16px;border:2px solid var(--line);border-top-color:var(--cielo);border-radius:50%;flex:none;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.load-banner button{background:none;border:1px solid var(--rojo);color:var(--rojo);border-radius:9px;padding:5px 10px;font-weight:700;font-size:11.5px;cursor:pointer;margin-left:auto}

/* ===== Menú principal: 2 accesos grandes, pensado para una sola mano ===== */
.menu{padding:8px 16px 16px;display:flex;flex-direction:column;gap:14px;max-width:520px;margin:0 auto}
.menu-card{display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--line);border-radius:var(--radius-card);padding:18px;text-align:left;cursor:pointer;box-shadow:var(--sh-card);transition:transform .12s ease,border-color .12s ease}
.menu-card:active{transform:scale(.98);border-color:var(--cielo)}
.menu-card .ico{width:52px;height:52px;border-radius:14px;flex:none;display:flex;align-items:center;justify-content:center;font-size:26px}
.menu-card.pedido .ico{background:var(--marino-hi)}
.menu-card.recibir .ico{background:var(--cielo-tint)}
.menu-card .txt{flex:1;min-width:0}
.menu-card .txt .t{font-family:'Manrope';font-weight:800;font-size:16px;color:var(--text)}
.menu-card .txt .s{font-size:12px;color:var(--muted);margin-top:2px;line-height:1.35}
.menu-card .arrow{color:var(--muted);font-size:20px;flex:none}

/* ===== Resumen del catálogo cargado ===== */
.stats-row{display:flex;gap:8px;padding:0 16px;max-width:520px;margin:0 auto 4px}
.stat{flex:1;background:var(--card2);border:1px solid var(--line2);border-radius:12px;padding:10px 12px}
.stat .n{font-family:'JetBrains Mono';font-weight:700;font-size:18px;color:var(--cielo)}
.stat .l{font-size:10px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.02em;margin-top:2px}

/* ===== Toast simple de confirmación ===== */
#toast{position:fixed;left:16px;right:16px;bottom:calc(20px + env(safe-area-inset-bottom));background:var(--card2);border:1px solid var(--cielo-d);color:var(--text);padding:12px 16px;border-radius:12px;font-size:13px;font-weight:600;box-shadow:var(--sh-float);z-index:500;transform:translateY(120%);opacity:0;transition:transform .25s ease,opacity .25s ease;max-width:520px;margin:0 auto}
#toast.on{transform:translateY(0);opacity:1}

/* ===== Overlay de módulo (pantalla completa) — mismo patrón para Recibir y,
   más adelante, Armar pedido: header fijo, cuerpo con scroll, pie fijo. ===== */
.ov{position:fixed;inset:0;z-index:400;background:var(--paper);display:flex;flex-direction:column}
.ov-head{flex:none;display:flex;align-items:center;gap:10px;padding:14px 16px;padding-top:max(14px,env(safe-area-inset-top));background:var(--marino-tint);border-bottom:1px solid var(--line)}
.ov-head h3{font-size:16px;font-weight:800}
.ov-close{margin-left:auto;width:34px;height:34px;border-radius:10px;background:var(--card);border:1px solid var(--line);color:var(--muted);font-size:18px;display:flex;align-items:center;justify-content:center;cursor:pointer}
.ov-body{flex:1;min-height:0;overflow-y:auto;padding:14px 16px;max-width:520px;margin:0 auto;width:100%}
.ov-foot{flex:none;padding:10px 16px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:var(--paper);max-width:520px;margin:0 auto;width:100%}

/* Campo genérico: label chico + input grande, siempre visible con una mano */
.field{margin-bottom:14px}
.field label{display:block;font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.03em;margin-bottom:5px}
.field input,.field select{width:100%;height:46px;padding:0 12px;border:1.5px solid var(--line);border-radius:12px;background:var(--card);color:var(--text);font-size:14px;font-family:inherit}
.field input:focus,.field select:focus{outline:none;border-color:var(--cielo);box-shadow:var(--focus-ring)}

/* Buscador con botón de escanear pegado al lado */
.search-row{display:flex;gap:8px}
.search-row input{flex:1}
.scan-btn{width:46px;height:46px;flex:none;border-radius:12px;background:var(--cielo-tint);border:1.5px solid var(--cielo-d);color:var(--cielo);font-size:19px;display:flex;align-items:center;justify-content:center;cursor:pointer}
.scan-btn:active{background:var(--cielo-d);color:#fff}

/* Lista de resultados de búsqueda */
.results{margin-top:8px}
.result-item{padding:10px 12px;background:var(--card);border:1px solid var(--line);border-radius:10px;margin-bottom:6px;cursor:pointer}
.result-item:active{border-color:var(--cielo)}
.result-item .n{font-weight:700;font-size:13.5px}
.result-item .s{color:var(--muted);font-size:11.5px;margin-top:2px}

/* Tarjeta del producto elegido */
.picked{display:none;padding:12px;background:var(--card2);border:1.5px solid var(--cielo-d);border-radius:12px;margin-top:8px}
.picked.on{display:block}
.picked .n{font-weight:800;font-size:14.5px}
.picked .s{color:var(--muted);font-size:12px;margin-top:2px}
.picked .stock{font-weight:700;margin-top:6px;font-size:12.5px}

/* Selector unidad/caja: dos botones tipo toggle */
.toggle-row{display:flex;gap:6px;margin-bottom:8px}
.toggle-btn{flex:1;padding:9px;border-radius:10px;border:1.5px solid var(--line);background:var(--card);color:var(--muted);font-weight:700;font-size:12px;cursor:pointer}
.toggle-btn.active{border-color:var(--cielo);background:var(--cielo-tint);color:var(--cielo)}

/* Selector cantidad grande con +/- (una sola mano) */
.qty-row{display:flex;align-items:center;gap:8px}
.qty-btn{width:46px;height:46px;flex:none;border-radius:12px;background:var(--card);border:1.5px solid var(--line);color:var(--text);font-size:22px;font-weight:700;display:flex;align-items:center;justify-content:center;cursor:pointer}
.qty-btn:active{background:var(--cielo-tint);border-color:var(--cielo)}
.qty-row input{text-align:center;font-family:'JetBrains Mono';font-size:17px;font-weight:700}

/* Fecha segmentada DD/MM/AAAA */
.fecha-row{display:flex;align-items:center;gap:6px}
.fecha-seg{width:100%;text-align:center;font-family:'JetBrains Mono';font-size:15px}
.fecha-sep{color:var(--muted);font-weight:700}
.fecha-cal-btn{width:46px;height:46px;flex:none;border-radius:12px;background:var(--card);border:1.5px solid var(--line);font-size:17px;cursor:pointer}
.fecha-date-hidden{position:absolute;opacity:0;pointer-events:none;width:1px;height:1px}

/* Precio destacado */
.precio-box{padding:10px 12px;background:var(--cielo-tint);border:1.5px solid var(--cielo-d);border-radius:12px}
.precio-box label{color:var(--cielo)}
.precio-box input{background:transparent;border:none;font-size:22px;font-weight:800;height:38px;padding:0;color:var(--text)}

.btn-primary{width:100%;height:50px;border-radius:14px;background:var(--brand-grad);border:none;color:#06212f;font-weight:800;font-size:15px;cursor:pointer;box-shadow:var(--sh-card)}
.btn-primary:disabled{opacity:.4;cursor:default}
.btn-primary:active:not(:disabled){transform:scale(.98)}
.btn-secondary{width:100%;height:44px;border-radius:14px;background:var(--card);border:1.5px solid var(--line);color:var(--muted);font-weight:700;font-size:13.5px;cursor:pointer;margin-top:8px}

/* ===== Escáner de cámara ===== */
#scanner-ov{position:fixed;inset:0;z-index:600;background:#000;display:flex;flex-direction:column}
#scanner-video{flex:1;width:100%;object-fit:cover}
.scan-frame{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none}
.scan-frame .box{width:78%;max-width:340px;aspect-ratio:1.6;border:3px solid var(--cielo);border-radius:16px;box-shadow:0 0 0 2000px rgba(0,0,0,.45)}
.scan-close{position:absolute;top:max(16px,env(safe-area-inset-top));right:16px;width:40px;height:40px;border-radius:50%;background:rgba(0,0,0,.6);color:#fff;font-size:20px;display:flex;align-items:center;justify-content:center;z-index:2}
.scan-hint{position:absolute;bottom:calc(30px + env(safe-area-inset-bottom));left:0;right:0;text-align:center;color:#fff;font-size:13px;font-weight:600;text-shadow:0 1px 4px rgba(0,0,0,.6)}
</style>
</head>
<body>

<div class="top">
  <div class="brand-mark">🛒</div>
  <div class="brand-txt">
    <div class="mk">Los Cumpas</div>
    <div class="loc">Mini Market · Pedidos y Recepción</div>
  </div>
</div>

<!-- Banner de estado: se muestra mientras carga el catálogo y si algo falla -->
<div class="load-banner" id="load-banner">
  <div class="spin"></div>
  <span id="load-msg">Cargando catálogo…</span>
</div>

<!-- Resumen rápido, solo visible cuando el catálogo ya cargó -->
<div class="stats-row hidden" id="stats-row">
  <div class="stat"><div class="n mono" id="stat-total">—</div><div class="l">Productos</div></div>
  <div class="stat"><div class="n mono" id="stat-sinprov">—</div><div class="l">Sin proveedor</div></div>
</div>

<div class="menu">
  <button class="menu-card pedido" id="btn-armar-pedido">
    <div class="ico">📝</div>
    <div class="txt">
      <div class="t">Armar pedido</div>
      <div class="s">Elegir productos y cantidades para pedir a un proveedor</div>
    </div>
    <div class="arrow">›</div>
  </button>

  <button class="menu-card recibir" id="btn-recibir">
    <div class="ico">📦</div>
    <div class="txt">
      <div class="t">Recibir mercadería</div>
      <div class="s">Escanear, sumar stock y registrar fecha de vencimiento</div>
    </div>
    <div class="arrow">›</div>
  </button>
</div>

<div id="toast"></div>

<!-- ===== MODAL: RECIBIR MERCADERÍA ===== -->
<div class="ov hidden" id="rc-ov">
  <div class="ov-head">
    <h3>📦 Recibir mercadería</h3>
    <button class="ov-close" id="rc-close" aria-label="Cerrar">✕</button>
  </div>
  <div class="ov-body">

    <div class="field">
      <label>Producto</label>
      <div class="search-row">
        <input id="rc-search" placeholder="Nombre, SKU o código…" autocomplete="off">
        <button class="scan-btn" id="rc-scan" type="button" aria-label="Escanear código">📷</button>
      </div>
      <div class="results" id="rc-results"></div>
      <div class="picked" id="rc-picked">
        <div class="n" id="rc-nom">—</div>
        <div class="s" id="rc-cat">—</div>
        <div class="stock" id="rc-stock">Stock actual: —</div>
        <button class="btn-secondary hidden" id="rc-activar-inv" style="margin-top:10px;color:var(--cielo);border-color:var(--cielo-d)" type="button">🔓 Activar inventario para este producto</button>
      </div>
    </div>

    <div class="field" id="rc-cantidad-field" style="display:none">
      <label>Cantidad recibida</label>
      <div class="toggle-row">
        <button type="button" class="toggle-btn active" id="rc-modo-unidad" data-modo="unidad">Por unidad</button>
        <button type="button" class="toggle-btn" id="rc-modo-caja" data-modo="caja">Por caja</button>
      </div>
      <div class="qty-row">
        <button class="qty-btn" id="rc-qty-menos" type="button">−</button>
        <input id="rc-cantidad" inputmode="decimal" placeholder="0" disabled>
        <button class="qty-btn" id="rc-qty-mas" type="button">+</button>
      </div>
      <div id="rc-caja-campos" class="hidden field" style="margin-top:10px;margin-bottom:0">
        <label>Unidades por caja</label>
        <input id="rc-unidades-caja" inputmode="numeric" placeholder="Ej: 24">
      </div>
    </div>

    <div class="field" id="rc-costo-field" style="display:none">
      <label>Costo y precio <span style="text-transform:none;font-weight:400">(opcional)</span></label>
      <div style="display:flex;gap:8px;margin-bottom:8px">
        <div style="flex:1">
          <div style="font-size:10px;color:var(--muted);font-weight:700;margin-bottom:4px">COSTO</div>
          <input id="rc-costo" inputmode="numeric" placeholder="$" style="height:44px;padding:0 10px;border:1.5px solid var(--line);border-radius:10px;background:var(--card);color:var(--text);font-family:'JetBrains Mono';width:100%">
        </div>
        <div style="flex:1">
          <div style="font-size:10px;color:var(--muted);font-weight:700;margin-bottom:4px">PRECIO VENTA</div>
          <input id="rc-precio" inputmode="numeric" placeholder="$" style="height:44px;padding:0 10px;border:1.5px solid var(--line);border-radius:10px;background:var(--card);color:var(--text);font-family:'JetBrains Mono';width:100%">
        </div>
      </div>
    </div>

    <div class="field" id="rc-fecha-field" style="display:none">
      <label>Fecha de vencimiento <span style="text-transform:none;font-weight:400">(opcional)</span></label>
      <div class="fecha-row">
        <input id="rc-fecha-dd" class="fecha-seg" inputmode="numeric" maxlength="2" placeholder="DD">
        <span class="fecha-sep">/</span>
        <input id="rc-fecha-mm" class="fecha-seg" inputmode="numeric" maxlength="2" placeholder="MM">
        <span class="fecha-sep">/</span>
        <input id="rc-fecha-aaaa" class="fecha-seg" inputmode="numeric" maxlength="4" placeholder="AAAA">
        <button type="button" class="fecha-cal-btn" id="rc-fecha-cal">📅</button>
        <input type="date" id="rc-fecha" class="fecha-date-hidden" tabindex="-1">
      </div>
    </div>

  </div>
  <div class="ov-foot">
    <button class="btn-primary" id="rc-guardar" disabled>Guardar y sumar stock</button>
  </div>
</div>

<!-- ===== ESCÁNER DE CÁMARA (reutilizable) ===== -->
<div id="scanner-ov" class="hidden">
  <video id="scanner-video" autoplay playsinline muted></video>
  <div class="scan-frame"><div class="box"></div></div>
  <button class="scan-close" id="scanner-close">✕</button>
  <div class="scan-hint">Apunta al código de barras</div>
</div>

<!-- ===== MODAL: CREAR PRODUCTO NUEVO ===== -->
<div class="ov hidden" id="cp-ov">
  <div class="ov-head">
    <h3>🆕 Crear producto</h3>
    <button class="ov-close" id="cp-close" aria-label="Cerrar">✕</button>
  </div>
  <div class="ov-body">
    <div class="field">
      <label>Nombre del producto</label>
      <input id="cp-nombre" placeholder="Ej: Coca Cola 1.5L" autocomplete="off">
    </div>
    <div class="field">
      <label>Código de barras <span style="text-transform:none;font-weight:400">(opcional)</span></label>
      <div class="search-row">
        <input id="cp-barcode" inputmode="numeric" placeholder="Ej: 7804673910023">
        <button class="scan-btn" id="cp-scan" type="button" aria-label="Escanear código">📷</button>
      </div>
    </div>
    <div class="field">
      <label>Costo y precio de venta</label>
      <div style="display:flex;gap:8px">
        <div style="flex:1">
          <div style="font-size:10px;color:var(--muted);font-weight:700;margin-bottom:4px">COSTO</div>
          <input id="cp-costo" inputmode="numeric" placeholder="$" style="height:44px;padding:0 10px;border:1.5px solid var(--line);border-radius:10px;background:var(--card);color:var(--text);font-family:'JetBrains Mono';width:100%">
        </div>
        <div style="flex:1">
          <div style="font-size:10px;color:var(--muted);font-weight:700;margin-bottom:4px">PRECIO VENTA</div>
          <input id="cp-precio" inputmode="numeric" placeholder="$" style="height:44px;padding:0 10px;border:1.5px solid var(--line);border-radius:10px;background:var(--card);color:var(--text);font-family:'JetBrains Mono';width:100%">
        </div>
      </div>
    </div>
    <div class="field">
      <label>Stock inicial <span style="text-transform:none;font-weight:400">(opcional)</span></label>
      <input id="cp-stock" inputmode="decimal" placeholder="0">
    </div>
    <div class="field">
      <label>Se vende por peso (kg)</label>
      <div class="toggle-row">
        <button type="button" class="toggle-btn active" id="cp-peso-no" data-v="0">No, por unidad</button>
        <button type="button" class="toggle-btn" id="cp-peso-si" data-v="1">Sí, por kg</button>
      </div>
    </div>
  </div>
  <div class="ov-foot">
    <button class="btn-primary" id="cp-guardar">Crear producto en Loyverse</button>
  </div>
</div>

<script>
// ============================================================
//  CONFIG
// ============================================================
const SYNC_URL = 'https://argomedo455.minimarketmarin01.workers.dev';

// DB: catálogo completo cargado en memoria al abrir la app (igual que Marín).
// Se guarda también en localStorage para que la app abra instantáneo la próxima
// vez, mientras el catálogo fresco llega en segundo plano.
let DB = { items: [] };

function showToast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg;
  t.classList.add('on');
  clearTimeout(showToast._t);
  showToast._t=setTimeout(()=>t.classList.remove('on'),2600);
}

// ============================================================
//  PERSISTENCIA LOCAL (arranque instantáneo)
// ============================================================
function persist(){
  try{ localStorage.setItem('cumpas_catalogo', JSON.stringify(DB.items)); }catch(e){}
}
function restoreLocal(){
  try{
    const raw=localStorage.getItem('cumpas_catalogo');
    if(raw){ DB.items=JSON.parse(raw); return true; }
  }catch(e){}
  return false;
}

// ============================================================
//  CARGA DEL CATÁLOGO DESDE EL WORKER
// ============================================================
function actualizarStats(){
  const total=DB.items.length;
  const sinProv=DB.items.filter(it=>!it.prov||it.prov==='SIN PROVEEDOR').length;
  document.getElementById('stat-total').textContent=total;
  document.getElementById('stat-sinprov').textContent=sinProv;
  document.getElementById('stats-row').classList.remove('hidden');
}

async function cargarCatalogo(silencioso){
  const banner=document.getElementById('load-banner');
  const msg=document.getElementById('load-msg');
  if(!silencioso){
    banner.classList.remove('hidden','err');
    banner.innerHTML='<div class="spin"></div><span id="load-msg">Cargando catálogo…</span>';
  }
  try{
    const res=await fetch(SYNC_URL+'?action=catalogo');
    const j=await res.json();
    if(!j||!j.ok) throw new Error((j&&j.error)||'Respuesta inválida del servidor');
    DB.items=j.items||[];
    persist();
    actualizarStats();
    banner.classList.add('hidden');
    if(silencioso) showToast('✓ Catálogo actualizado · '+DB.items.length+' productos');
  }catch(e){
    banner.classList.remove('hidden');
    banner.classList.add('err');
    banner.innerHTML='<span>⚠️ No se pudo cargar el catálogo: '+e.message+'</span><button id="load-retry">Reintentar</button>';
    document.getElementById('load-retry').onclick=()=>cargarCatalogo(false);
  }
}

// ============================================================
//  ARRANQUE
// ============================================================
(function init(){
  const habiaLocal=restoreLocal();
  if(habiaLocal){
    // Ya hay catálogo guardado: la app se ve y usa al instante, mientras se
    // refresca en segundo plano (silencioso) por si algo cambió en Loyverse.
    actualizarStats();
    document.getElementById('load-banner').classList.add('hidden');
    cargarCatalogo(true);
  }else{
    cargarCatalogo(false);
  }
})();

// ============================================================
//  BÚSQUEDA DE PRODUCTOS (en memoria, sobre DB.items) — igual
//  que Marín: todas las palabras deben aparecer en nombre, SKU
//  o código de barras, en cualquier orden. Máximo 25 resultados.
// ============================================================
function buscarProductos(q){
  q=(q||'').toLowerCase().trim();
  if(!q)return [];
  const palabras=q.split(/\s+/).filter(Boolean);
  return (DB.items||[]).filter(it=>{
    const nom=(it.nombre||'').toLowerCase();
    const ref=String(it.ref||'');
    const bc=it.barcode?String(it.barcode):'';
    return palabras.every(p=>nom.includes(p)||ref.includes(p)||bc.includes(p));
  }).slice(0,25);
}

// ============================================================
//  MÓDULO: RECIBIR MERCADERÍA
// ============================================================
const rcState={ item:null, modo:'unidad' };

function abrirModal(id){ document.getElementById(id).classList.remove('hidden'); }
function cerrarModal(id){ document.getElementById(id).classList.add('hidden'); }

function rcReset(){
  rcState.item=null; rcState.modo='unidad';
  document.getElementById('rc-search').value='';
  document.getElementById('rc-results').innerHTML='';
  document.getElementById('rc-picked').classList.remove('on');
  document.getElementById('rc-cantidad-field').style.display='none';
  document.getElementById('rc-costo-field').style.display='none';
  document.getElementById('rc-fecha-field').style.display='none';
  const cIn=document.getElementById('rc-cantidad'); cIn.value=''; cIn.disabled=true; cIn.placeholder='0';
  document.getElementById('rc-unidades-caja').value='';
  document.getElementById('rc-caja-campos').classList.add('hidden');
  document.getElementById('rc-costo').value='';
  document.getElementById('rc-precio').value='';
  document.getElementById('rc-fecha').value='';
  document.getElementById('rc-fecha-dd').value='';
  document.getElementById('rc-fecha-mm').value='';
  document.getElementById('rc-fecha-aaaa').value='';
  rcSetModo('unidad');
  document.getElementById('rc-guardar').disabled=true;
}

function rcSetModo(modo){
  rcState.modo=modo;
  document.getElementById('rc-modo-unidad').classList.toggle('active',modo==='unidad');
  document.getElementById('rc-modo-caja').classList.toggle('active',modo==='caja');
  document.getElementById('rc-caja-campos').classList.toggle('hidden',modo!=='caja');
}
document.getElementById('rc-modo-unidad').onclick=()=>rcSetModo('unidad');
document.getElementById('rc-modo-caja').onclick=()=>rcSetModo('caja');

function rcPick(ref){
  const it=(DB.items||[]).find(i=>i.ref===ref);
  if(!it)return;
  rcState.item=it;
  document.getElementById('rc-search').value=it.nombre;
  document.getElementById('rc-results').innerHTML='';
  document.getElementById('rc-picked').classList.add('on');
  document.getElementById('rc-nom').textContent=it.nombre;
  document.getElementById('rc-cat').textContent=it.prov+(it.barcode?' · '+it.barcode:'');
  const stockTxt=(it.stock==null)?'sin control':(it.stock+(it.peso?' kg':' u'));
  document.getElementById('rc-stock').textContent='Stock actual: '+stockTxt;

  if(!it.track){
    // Producto sin seguimiento de inventario: se ofrece activarlo (1 toque) en vez de
    // solo bloquear — así no hay que ir a Loyverse a mano para recibir este producto.
    document.getElementById('rc-cantidad-field').style.display='none';
    document.getElementById('rc-costo-field').style.display='none';
    document.getElementById('rc-fecha-field').style.display='none';
    const btnActivar=document.getElementById('rc-activar-inv');
    btnActivar.classList.remove('hidden');
    btnActivar.disabled=false;
    btnActivar.textContent='🔓 Activar inventario para este producto';
    document.getElementById('rc-guardar').disabled=true;
    return;
  }
  document.getElementById('rc-activar-inv').classList.add('hidden');

  document.getElementById('rc-cantidad-field').style.display='block';
  document.getElementById('rc-costo-field').style.display='block';
  document.getElementById('rc-fecha-field').style.display='block';
  const cIn=document.getElementById('rc-cantidad');
  cIn.disabled=false; cIn.value=''; cIn.placeholder=it.peso?'0.000':'0';
  document.getElementById('rc-costo').value=it.coste||'';
  document.getElementById('rc-precio').value=it.precio||'';
  rcSetModo('unidad');
  rcValidar();
}

function rcValidar(){
  const cant=Number(document.getElementById('rc-cantidad').value)||0;
  document.getElementById('rc-guardar').disabled=!(rcState.item&&rcState.item.track&&cant>0);
}

document.getElementById('rc-search').oninput=e=>{
  const q=e.target.value;
  const lista=buscarProductos(q);
  const box=document.getElementById('rc-results');
  if(lista.length){
    box.innerHTML=lista.map(it=>`<div class="result-item" data-ref="${it.ref}"><div class="n">${it.nombre}</div><div class="s">${it.prov}${it.barcode?' · '+it.barcode:''}</div></div>`).join('');
    box.querySelectorAll('[data-ref]').forEach(el=>el.onclick=()=>rcPick(el.dataset.ref));
  }else if(q.trim().length>=3){
    box.innerHTML='<div class="result-item" style="color:var(--muted)">Sin coincidencias. <span id="rc-crear-nuevo" style="color:var(--cielo);font-weight:700;text-decoration:underline">Crear producto nuevo</span></div>';
    document.getElementById('rc-crear-nuevo').onclick=()=>openCrearProducto(q.trim());
  }else{
    box.innerHTML='';
  }
};

document.getElementById('rc-activar-inv').onclick=async()=>{
  const it=rcState.item; if(!it)return;
  const btn=document.getElementById('rc-activar-inv');
  btn.disabled=true; btn.textContent='Verificando…';
  try{
    const res=await fetch(SYNC_URL,{method:'POST',body:JSON.stringify({action:'habilitar_track_stock',payload:{sku:it.ref}})});
    const j=await res.json();
    if(j&&j.ok){
      it.track=true; persist();
      btn.textContent=j.yaEstaba?'✅ Inventario ya activado':'✅ Inventario activado';
      showToast('🔓 Seguimiento activado · '+it.nombre);
      setTimeout(()=>rcPick(it.ref),700); // refresca la vista con los campos ya habilitados
    }else{
      showToast('❌ '+((j&&j.error)||'No se pudo activar en Loyverse'));
      btn.disabled=false; btn.textContent='🔓 Activar inventario para este producto';
    }
  }catch(e){
    showToast('❌ Error de conexión al activar');
    btn.disabled=false; btn.textContent='🔓 Activar inventario para este producto';
  }
};

document.getElementById('rc-qty-menos').onclick=()=>{
  const i=document.getElementById('rc-cantidad');
  const step=rcState.item&&rcState.item.peso?0.05:1;
  i.value=Math.max(0,(Number(i.value)||0)-step).toFixed(rcState.item&&rcState.item.peso?3:0);
  rcValidar();
};
document.getElementById('rc-qty-mas').onclick=()=>{
  const i=document.getElementById('rc-cantidad');
  const step=rcState.item&&rcState.item.peso?0.05:1;
  i.value=((Number(i.value)||0)+step).toFixed(rcState.item&&rcState.item.peso?3:0);
  rcValidar();
};
document.getElementById('rc-cantidad').oninput=rcValidar;

// Fecha segmentada: al completar DD y MM, salta solo al siguiente campo.
function wireFechaSegmentada(ddId,mmId,aaaaId,hiddenId,calId){
  const dd=document.getElementById(ddId),mm=document.getElementById(mmId),aaaa=document.getElementById(aaaaId),hidden=document.getElementById(hiddenId),cal=document.getElementById(calId);
  dd.oninput=()=>{ if(dd.value.length>=2)mm.focus(); };
  mm.oninput=()=>{ if(mm.value.length>=2)aaaa.focus(); };
  cal.onclick=()=>{
    hidden.showPicker?hidden.showPicker():hidden.click();
  };
  hidden.onchange=()=>{
    if(!hidden.value)return;
    const [y,m,d]=hidden.value.split('-');
    dd.value=d; mm.value=m; aaaa.value=y;
  };
}
wireFechaSegmentada('rc-fecha-dd','rc-fecha-mm','rc-fecha-aaaa','rc-fecha','rc-fecha-cal');
function fechaSegmentadaTexto(ddId,mmId,aaaaId){
  const dd=document.getElementById(ddId).value.padStart(2,'0');
  const mm=document.getElementById(mmId).value.padStart(2,'0');
  const aaaa=document.getElementById(aaaaId).value;
  if(!dd||!mm||!aaaa||aaaa.length<4)return '';
  return dd+'/'+mm+'/'+aaaa;
}

document.getElementById('rc-guardar').onclick=async()=>{
  const btn=document.getElementById('rc-guardar');
  const it=rcState.item; if(!it)return;
  const cantIngresada=Number(document.getElementById('rc-cantidad').value)||0;
  const uCaja=Number(document.getElementById('rc-unidades-caja').value)||0;
  const cantidad=(rcState.modo==='caja'&&uCaja>0)?(cantIngresada*uCaja):cantIngresada;
  const fecha=fechaSegmentadaTexto('rc-fecha-dd','rc-fecha-mm','rc-fecha-aaaa');
  const nuevoCosto=Number(document.getElementById('rc-costo').value)||0;
  const nuevoPrecio=Number(document.getElementById('rc-precio').value)||0;
  const costoCambio=nuevoCosto>0&&nuevoCosto!==it.coste;
  const precioCambio=nuevoPrecio>0&&nuevoPrecio!==it.precio;

  btn.disabled=true; btn.textContent='Guardando…';
  const ctrl=new AbortController();
  const to=setTimeout(()=>ctrl.abort(),25000);
  try{
    const payload={ sku:it.ref, cantidad, fechaVencimiento:fecha };
    if(costoCambio)payload.costo=nuevoCosto;
    if(precioCambio)payload.precio=nuevoPrecio;
    const res=await fetch(SYNC_URL,{method:'POST',body:JSON.stringify({action:'lote_nuevo',payload}),signal:ctrl.signal});
    const j=await res.json();
    if(j&&j.ok){
      // Refresca la copia local al instante (sin esperar a resincronizar todo).
      const itLocal=(DB.items||[]).find(x=>x.ref===it.ref);
      if(itLocal){
        if(j.nuevoStock!=null)itLocal.stock=j.nuevoStock;
        if(j.costoAplicado!=null)itLocal.coste=j.costoAplicado;
        if(j.precioAplicado!=null)itLocal.precio=j.precioAplicado;
        persist();
      }
      let msg='✓ Recibido: '+it.nombre+' · +'+cantidad+' '+(it.peso?'kg':'u')+(fecha?(' · vence '+fecha):'');
      showToast(msg);
      if(j.avisoStock) setTimeout(()=>showToast(j.avisoStock),2800);
      rcReset();
      document.getElementById('rc-search').focus();
    }else{
      showToast('❌ Error: '+((j&&j.error)||'no se pudo guardar'));
    }
  }catch(e){
    if(e.name==='AbortError') showToast('⏱️ El guardado tardó demasiado. Verifica tu conexión.');
    else showToast('❌ Error de conexión al recibir la mercadería');
  }finally{
    clearTimeout(to);
    btn.disabled=false; btn.textContent='Guardar y sumar stock';
    rcValidar();
  }
};

function openRecibir(){ rcReset(); abrirModal('rc-ov'); document.getElementById('rc-search').focus(); }
function closeRecibir(){ cerrarModal('rc-ov'); }
document.getElementById('rc-close').onclick=closeRecibir;

// ============================================================
//  ESCÁNER DE CÁMARA — usa BarcodeDetector nativo (soportado en
//  Chrome Android, que es donde corre esta app). Vibra al detectar
//  y vuelve a abrir el modal desde donde se llamó.
// ============================================================
let scannerStream=null, scannerLoopId=null;

async function openScanner(onDetect){
  if(!('BarcodeDetector' in window)){
    showToast('❌ Tu navegador no soporta escaneo de cámara. Usa Chrome actualizado.');
    return;
  }
  const ov=document.getElementById('scanner-ov');
  const video=document.getElementById('scanner-video');
  ov.classList.remove('hidden');
  try{
    scannerStream=await navigator.mediaDevices.getUserMedia({ video:{ facingMode:'environment' } });
    video.srcObject=scannerStream;
    await video.play();
  }catch(e){
    showToast('❌ No se pudo acceder a la cámara: '+e.message);
    closeScanner();
    return;
  }
  const detector=new BarcodeDetector({ formats:['ean_13','ean_8','upc_a','upc_e','code_128'] });
  let detectando=false;
  const loop=async()=>{
    if(!scannerStream)return;
    if(!detectando){
      detectando=true;
      try{
        const codigos=await detector.detect(video);
        if(codigos.length){
          if(navigator.vibrate)navigator.vibrate(80);
          const valor=codigos[0].rawValue;
          closeScanner();
          onDetect(valor);
          return;
        }
      }catch(e){/* frame no legible, sigue intentando */}
      detectando=false;
    }
    scannerLoopId=requestAnimationFrame(loop);
  };
  scannerLoopId=requestAnimationFrame(loop);
}
function closeScanner(){
  document.getElementById('scanner-ov').classList.add('hidden');
  if(scannerLoopId)cancelAnimationFrame(scannerLoopId);
  scannerLoopId=null;
  if(scannerStream){ scannerStream.getTracks().forEach(t=>t.stop()); scannerStream=null; }
}
document.getElementById('scanner-close').onclick=closeScanner;

document.getElementById('rc-scan').onclick=()=>{
  closeRecibir();
  openScanner(code=>{
    abrirModal('rc-ov');
    const lista=buscarProductos(code);
    if(lista.length===1) rcPick(lista[0].ref);
    else if(lista.length===0) showToast('⚠️ Código no encontrado en el catálogo: '+code);
    else{
      document.getElementById('rc-search').value=code;
      document.getElementById('rc-search').dispatchEvent(new Event('input',{bubbles:true}));
    }
  });
};

// ============================================================
//  MÓDULO: CREAR PRODUCTO NUEVO
//  Se abre desde Recepción cuando una búsqueda no encuentra nada
//  (mismo patrón que Marín) — crea el producto en Loyverse con un
//  SKU asignado automáticamente, y vuelve a Recepción con él ya
//  seleccionado, listo para recibir stock.
// ============================================================
const cpState={ peso:false, origen:null };

function openCrearProducto(nombreSugerido){
  cpState.peso=false;
  cpState.origen=document.getElementById('rc-ov').classList.contains('hidden')?null:'rc';
  document.getElementById('cp-nombre').value=nombreSugerido||'';
  document.getElementById('cp-barcode').value=/^\d{6,}$/.test(nombreSugerido||'')?nombreSugerido:'';
  if(/^\d{6,}$/.test(nombreSugerido||''))document.getElementById('cp-nombre').value='';
  document.getElementById('cp-costo').value='';
  document.getElementById('cp-precio').value='';
  document.getElementById('cp-stock').value='';
  cpSetPeso(false);
  closeRecibir();
  abrirModal('cp-ov');
  document.getElementById('cp-nombre').focus();
}
function closeCrearProducto(){
  cerrarModal('cp-ov');
  if(cpState.origen==='rc') openRecibir();
}
document.getElementById('cp-close').onclick=closeCrearProducto;

function cpSetPeso(esPeso){
  cpState.peso=esPeso;
  document.getElementById('cp-peso-no').classList.toggle('active',!esPeso);
  document.getElementById('cp-peso-si').classList.toggle('active',esPeso);
}
document.getElementById('cp-peso-no').onclick=()=>cpSetPeso(false);
document.getElementById('cp-peso-si').onclick=()=>cpSetPeso(true);

document.getElementById('cp-scan').onclick=()=>{
  cerrarModal('cp-ov');
  openScanner(code=>{
    abrirModal('cp-ov');
    document.getElementById('cp-barcode').value=code;
  });
};

document.getElementById('cp-guardar').onclick=async()=>{
  const nombre=document.getElementById('cp-nombre').value.trim();
  if(!nombre){ showToast('⚠️ Escribe el nombre del producto'); return; }
  const btn=document.getElementById('cp-guardar');
  btn.disabled=true; btn.textContent='Creando…';
  try{
    const payload={
      nombre,
      barcode:document.getElementById('cp-barcode').value.trim(),
      costo:document.getElementById('cp-costo').value,
      precio:document.getElementById('cp-precio').value,
      stockInicial:document.getElementById('cp-stock').value,
      soldByWeight:cpState.peso,
      trackStock:true
    };
    const res=await fetch(SYNC_URL,{method:'POST',body:JSON.stringify({action:'crear_producto',payload})});
    const j=await res.json();
    if(j&&j.ok){
      // Agrega el producto recién creado a la copia local, para que aparezca en
      // búsquedas inmediatamente sin esperar a la próxima sincronización.
      (DB.items=DB.items||[]).push({
        ref:j.sku, nombre:j.nombre, cat:'SIN CATEGORÍA', prov:'SIN PROVEEDOR',
        barcode:j.barcode||'', precio:j.precio||0, coste:j.costo||0, stock:j.stock,
        peso:j.peso, track:j.track
      });
      persist();
      showToast('✅ Producto creado: '+j.nombre+' (SKU '+j.sku+')');
      cerrarModal('cp-ov');
      if(cpState.origen==='rc'){ openRecibir(); rcPick(j.sku); }
    }else{
      showToast('❌ Error: '+((j&&j.error)||'no se pudo crear el producto'));
    }
  }catch(e){
    showToast('❌ Error de conexión al crear el producto');
  }finally{
    btn.disabled=false; btn.textContent='Crear producto en Loyverse';
  }
};

// ============================================================
//  NAVEGACIÓN
// ============================================================
document.getElementById('btn-armar-pedido').onclick=()=>{
  showToast('Módulo "Armar pedido" — se conecta en el siguiente paso');
};
document.getElementById('btn-recibir').onclick=openRecibir;
