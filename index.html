<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0A0F1A">
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Los Cumpas">
<title>Los Cumpas · Pedidos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  /* ===== PALETA "LOS CUMPAS" — celeste/azul marino, derivada del logo =====
     Fondo azul casi negro, tarjetas un tono más claro, acento celeste vivo
     (el círculo del logo) y azul marino profundo (el texto del logo). */
  --ink:#0A0F1A;--paper:#0A0F1A;--card:#121B2E;--card2:#182541;
  --line:#22304A;--line2:#1A2743;
  --text:#EAF1FB;--muted:#8CA0C2;

  /* Marca: celeste vivo + marino profundo. El celeste es la acción principal
     (botones, foco, selección) — el marino da peso a headers y marca. */
  --cielo:#4FB6E8;--cielo-d:#2E8FC2;--cielo-tint:#12293A;
  --marino:#16294D;--marino-hi:#1F3A6B;--marino-tint:#101B33;
  --brand-grad:linear-gradient(120deg,#4FB6E8,#2E8FC2);

  /* Estados — mismos códigos semánticos que ya usa el equipo en Marín, para
     no reaprender colores: rojo urgente, ámbar a pedir, verde saludable. */
  --rojo:#E8746A;--rojo-bg:#3A1E1E;
  --ambar:#E8B84F;--ambar-bg:#3A2E12;
  --verde:#5FD08A;--verde-bg:#123A22;

  --sh-card:0 2px 10px rgba(0,0,0,.35);
  --sh-float:0 6px 20px rgba(0,0,0,.45);
  --focus-ring:0 0 0 3px rgba(79,182,232,.35);
  --radius-card:18px;--radius-btn:14px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%;width:100%;overflow-x:hidden}
body{font-family:'Inter',system-ui,sans-serif;background:var(--paper);color:var(--text);font-size:14px;line-height:1.4;-webkit-tap-highlight-color:transparent;width:100%;max-width:100%;min-height:100vh;padding-bottom:calc(24px + env(safe-area-inset-bottom))}
.mono{font-family:'JetBrains Mono',ui-monospace,monospace;font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:'Manrope',system-ui,sans-serif}
button{font-family:inherit}
:focus-visible{outline:none;box-shadow:var(--focus-ring)}

/* ===== Encabezado ===== */
.top{background:linear-gradient(160deg,var(--marino-tint) 0%,#0D1730 100%);border-bottom:1px solid var(--line);padding:14px 18px;padding-top:max(14px,env(safe-area-inset-top));display:flex;align-items:center;gap:12px}
.brand-mark{width:38px;height:38px;border-radius:12px;flex:none;background:var(--brand-grad);display:flex;align-items:center;justify-content:center;font-size:19px;box-shadow:var(--sh-card)}
.brand-txt .mk{font-family:'Manrope';font-weight:800;font-size:17px;letter-spacing:-.01em;color:var(--text)}
.brand-txt .loc{color:var(--muted);font-size:11.5px;font-weight:600;margin-top:1px}

/* ===== Estado de carga del catálogo ===== */
.load-banner{margin:14px 16px;padding:12px 14px;background:var(--card);border:1px solid var(--line);border-radius:var(--radius-card);display:flex;align-items:center;gap:10px;font-size:12.5px;color:var(--muted)}
.load-banner.err{border-color:var(--rojo);color:var(--rojo);background:var(--rojo-bg)}
.load-banner .spin{width:16px;height:16px;border:2px solid var(--line);border-top-color:var(--cielo);border-radius:50%;flex:none;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.load-banner button{background:none;border:1px solid var(--rojo);color:var(--rojo);border-radius:9px;padding:5px 10px;font-weight:700;font-size:11.5px;cursor:pointer;margin-left:auto}

/* ===== Menú principal: 2 accesos grandes, pensado para una sola mano ===== */
.menu{padding:8px 16px 16px;display:flex;flex-direction:column;gap:14px;max-width:520px;margin:0 auto}
.menu-card{display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--line);border-radius:var(--radius-card);padding:18px;text-align:left;cursor:pointer;box-shadow:var(--sh-card);transition:transform .12s ease,border-color .12s ease}
.menu-card:active{transform:scale(.98);border-color:var(--cielo)}
.menu-card .ico{width:52px;height:52px;border-radius:14px;flex:none;display:flex;align-items:center;justify-content:center;font-size:26px}
.menu-card.pedido .ico{background:var(--marino-hi)}
.menu-card.recibir .ico{background:var(--cielo-tint)}
.menu-card .txt{flex:1;min-width:0}
.menu-card .txt .t{font-family:'Manrope';font-weight:800;font-size:16px;color:var(--text)}
.menu-card .txt .s{font-size:12px;color:var(--muted);margin-top:2px;line-height:1.35}
.menu-card .arrow{color:var(--muted);font-size:20px;flex:none}

/* ===== Resumen del catálogo cargado ===== */
.stats-row{display:flex;gap:8px;padding:0 16px;max-width:520px;margin:0 auto 4px}
.stat{flex:1;background:var(--card2);border:1px solid var(--line2);border-radius:12px;padding:10px 12px}
.stat .n{font-family:'JetBrains Mono';font-weight:700;font-size:18px;color:var(--cielo)}
.stat .l{font-size:10px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.02em;margin-top:2px}

/* ===== Toast simple de confirmación ===== */
#toast{position:fixed;left:16px;right:16px;bottom:calc(20px + env(safe-area-inset-bottom));background:var(--card2);border:1px solid var(--cielo-d);color:var(--text);padding:12px 16px;border-radius:12px;font-size:13px;font-weight:600;box-shadow:var(--sh-float);z-index:500;transform:translateY(120%);opacity:0;transition:transform .25s ease,opacity .25s ease;max-width:520px;margin:0 auto}
#toast.on{transform:translateY(0);opacity:1}
</style>
</head>
<body>

<div class="top">
  <div class="brand-mark">🛒</div>
  <div class="brand-txt">
    <div class="mk">Los Cumpas</div>
    <div class="loc">Mini Market · Pedidos y Recepción</div>
  </div>
</div>

<!-- Banner de estado: se muestra mientras carga el catálogo y si algo falla -->
<div class="load-banner" id="load-banner">
  <div class="spin"></div>
  <span id="load-msg">Cargando catálogo…</span>
</div>

<!-- Resumen rápido, solo visible cuando el catálogo ya cargó -->
<div class="stats-row hidden" id="stats-row">
  <div class="stat"><div class="n mono" id="stat-total">—</div><div class="l">Productos</div></div>
  <div class="stat"><div class="n mono" id="stat-sinprov">—</div><div class="l">Sin proveedor</div></div>
</div>

<div class="menu">
  <button class="menu-card pedido" id="btn-armar-pedido">
    <div class="ico">📝</div>
    <div class="txt">
      <div class="t">Armar pedido</div>
      <div class="s">Elegir productos y cantidades para pedir a un proveedor</div>
    </div>
    <div class="arrow">›</div>
  </button>

  <button class="menu-card recibir" id="btn-recibir">
    <div class="ico">📦</div>
    <div class="txt">
      <div class="t">Recibir mercadería</div>
      <div class="s">Escanear, sumar stock y registrar fecha de vencimiento</div>
    </div>
    <div class="arrow">›</div>
  </button>
</div>

<div id="toast"></div>

<script>
// ============================================================
//  CONFIG
// ============================================================
const SYNC_URL = 'https://argomedo455.minimarketmarin01.workers.dev';

// DB: catálogo completo cargado en memoria al abrir la app (igual que Marín).
// Se guarda también en localStorage para que la app abra instantáneo la próxima
// vez, mientras el catálogo fresco llega en segundo plano.
let DB = { items: [] };

function showToast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg;
  t.classList.add('on');
  clearTimeout(showToast._t);
  showToast._t=setTimeout(()=>t.classList.remove('on'),2600);
}

// ============================================================
//  PERSISTENCIA LOCAL (arranque instantáneo)
// ============================================================
function persist(){
  try{ localStorage.setItem('cumpas_catalogo', JSON.stringify(DB.items)); }catch(e){}
}
function restoreLocal(){
  try{
    const raw=localStorage.getItem('cumpas_catalogo');
    if(raw){ DB.items=JSON.parse(raw); return true; }
  }catch(e){}
  return false;
}

// ============================================================
//  CARGA DEL CATÁLOGO DESDE EL WORKER
// ============================================================
function actualizarStats(){
  const total=DB.items.length;
  const sinProv=DB.items.filter(it=>!it.prov||it.prov==='SIN PROVEEDOR').length;
  document.getElementById('stat-total').textContent=total;
  document.getElementById('stat-sinprov').textContent=sinProv;
  document.getElementById('stats-row').classList.remove('hidden');
}

async function cargarCatalogo(silencioso){
  const banner=document.getElementById('load-banner');
  const msg=document.getElementById('load-msg');
  if(!silencioso){
    banner.classList.remove('hidden','err');
    banner.innerHTML='<div class="spin"></div><span id="load-msg">Cargando catálogo…</span>';
  }
  try{
    const res=await fetch(SYNC_URL+'?action=catalogo');
    const j=await res.json();
    if(!j||!j.ok) throw new Error((j&&j.error)||'Respuesta inválida del servidor');
    DB.items=j.items||[];
    persist();
    actualizarStats();
    banner.classList.add('hidden');
    if(silencioso) showToast('✓ Catálogo actualizado · '+DB.items.length+' productos');
  }catch(e){
    banner.classList.remove('hidden');
    banner.classList.add('err');
    banner.innerHTML='<span>⚠️ No se pudo cargar el catálogo: '+e.message+'</span><button id="load-retry">Reintentar</button>';
    document.getElementById('load-retry').onclick=()=>cargarCatalogo(false);
  }
}

// ============================================================
//  ARRANQUE
// ============================================================
(function init(){
  const habiaLocal=restoreLocal();
  if(habiaLocal){
    // Ya hay catálogo guardado: la app se ve y usa al instante, mientras se
    // refresca en segundo plano (silencioso) por si algo cambió en Loyverse.
    actualizarStats();
    document.getElementById('load-banner').classList.add('hidden');
    cargarCatalogo(true);
  }else{
    cargarCatalogo(false);
  }
})();

// ============================================================
//  NAVEGACIÓN — placeholders: los módulos reales de Armar pedido
//  y Recibir mercadería se conectan en los próximos pasos.
// ============================================================
document.getElementById('btn-armar-pedido').onclick=()=>{
  showToast('Módulo "Armar pedido" — se conecta en el siguiente paso');
};
document.getElementById('btn-recibir').onclick=()=>{
  showToast('Módulo "Recibir mercadería" — se conecta en el siguiente paso');
};
</script>
</body>
</html>
